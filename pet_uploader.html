<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Buddy Gif Pet Uploader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap');

        :root {
            --primary: #00ff9d;
            --bg: #0d0d0d;
            --card: #1a1a1a;
            --text: #ffffff;
            --text-dim: #888888;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--primary);
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Outfit';
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .section-title {
            color: var(--primary);
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .config-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .config-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 120px;
        }

        label {
            font-size: 12px;
            color: var(--text-dim);
        }

        input[type="text"],
        input[type="color"],
        select {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 6px;
        }

        .states-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .state-item {
            background: #252525;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid transparent;
        }

        .state-item:hover {
            border-color: var(--primary);
        }

        .state-label {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .preview-area {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 5px;
            min-height: 50px;
            border: 1px dashed #444;
            border-radius: 4px;
            padding: 5px;
        }

        .preview-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: #000;
            border-radius: 4px;
        }

        #log {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #00ff00;
            background: #000;
            padding: 15px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .progress-bar {
            background: #222;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }

        .progress-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: 0.1s;
        }

        .raw-data {
            color: #666;
            font-style: italic;
            font-size: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Claude Buddy Ultimate Uploader</h1>
            <p>已整合通訊修正，支援完整寵物自定義</p>
        </header>

        <div class="card">
            <div style="display: flex; gap: 10px; align-items: center; justify-content: space-between;">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="baud-rate">
                        <option value="115200">115200</option>
                        <option value="921600">921600</option>
                    </select>
                    <button id="btn-connect" class="btn">連接設備</button>
                    <span id="conn-status" style="color: #ff4d4d; font-weight: 600;">未連接</span>
                </div>
                <button id="btn-status" class="btn" style="background: #333; color: white;" disabled>檢查空間</button>
            </div>
        </div>

        <div id="main-ui" style="opacity: 0.5; pointer-events: none;">
            <div class="card">
                <div class="section-title">1. 配色與基本資訊</div>
                <div class="config-row">
                    <div class="config-item"><label>名稱</label><input type="text" id="pet-name" value="bufo"></div>
                    <div class="config-item"><label>身體色</label><input type="color" id="color-body" value="#6B8E23">
                    </div>
                    <div class="config-item"><label>背景色</label><input type="color" id="color-bg" value="#000000"></div>
                    <div class="config-item"><label>文字色</label><input type="color" id="color-text" value="#FFFFFF">
                    </div>
                    <div class="config-item"><label>次要文字</label><input type="color" id="color-textDim" value="#808080">
                    </div>
                    <div class="config-item"><label>墨水色</label><input type="color" id="color-ink" value="#000000"></div>
                </div>

                <div class="section-title">2. 動畫上傳</div>
                <div class="states-grid">
                    <div class="state-item" style="grid-column: 1 / -1;">
                        <span class="state-label">平時閒置 (Idle) * [可多選]</span>
                        <input type="file" id="file-idle" accept=".gif" multiple
                            onchange="previewMulti(this, 'prev-idle')">
                        <div id="prev-idle" class="preview-area"></div>
                    </div>
                    <div class="state-item"><span class="state-label">睡覺 (Sleep)</span><input type="file"
                            id="file-sleep" accept=".gif" onchange="previewMulti(this, 'prev-sleep')">
                        <div id="prev-sleep" class="preview-area"></div>
                    </div>
                    <div class="state-item"><span class="state-label">工作中 (Busy)</span><input type="file" id="file-busy"
                            accept=".gif" onchange="previewMulti(this, 'prev-busy')">
                        <div id="prev-busy" class="preview-area"></div>
                    </div>
                    <div class="state-item"><span class="state-label">急躁 (Attention)</span><input type="file"
                            id="file-attention" accept=".gif" onchange="previewMulti(this, 'prev-attention')">
                        <div id="prev-attention" class="preview-area"></div>
                    </div>
                    <div class="state-item"><span class="state-label">慶祝 (Celebrate)</span><input type="file"
                            id="file-celebrate" accept=".gif" onchange="previewMulti(this, 'prev-celebrate')">
                        <div id="prev-celebrate" class="preview-area"></div>
                    </div>
                    <div class="state-item"><span class="state-label">暈頭 (Dizzy)</span><input type="file"
                            id="file-dizzy" accept=".gif" onchange="previewMulti(this, 'prev-dizzy')">
                        <div id="prev-dizzy" class="preview-area"></div>
                    </div>
                    <div class="state-item"><span class="state-label">愛心 (Heart)</span><input type="file"
                            id="file-heart" accept=".gif" onchange="previewMulti(this, 'prev-heart')">
                        <div id="prev-heart" class="preview-area"></div>
                    </div>
                </div>

                <div style="margin-top: 30px; text-align: center;">
                    <button id="btn-upload" class="btn" style="padding: 15px 50px; font-size: 18px;">開始安裝寵物</button>
                </div>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <p id="progress-detail"
                    style="text-align: center; font-size: 12px; color: var(--text-dim); margin-top: 5px;"></p>
            </div>
        </div>

        <div class="section-title">系統通訊日誌</div>
        <div id="log"></div>
    </div>

    <script>
        let port, reader, pendingResolver = null;
        const logEl = document.getElementById('log');

        function log(msg, isRaw = false) {
            const div = document.createElement('div');
            if (isRaw) div.className = 'raw-data';
            div.textContent = (isRaw ? "<< " : "> ") + msg;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }

        function previewMulti(input, areaId) {
            const area = document.getElementById(areaId);
            area.innerHTML = '';
            for (let file of input.files) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'preview-img';
                    area.appendChild(img);
                }
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('btn-connect').onclick = async () => {
            try {
                port = await navigator.serial.requestPort();
                const baud = parseInt(document.getElementById('baud-rate').value);
                await port.open({ baudRate: baud });

                try {
                    await port.setSignals({ dataTerminalReady: true, requestToSend: true });
                    log("已設定 DTR/RTS 訊號");
                } catch (err) { }

                document.getElementById('conn-status').textContent = "已連線";
                document.getElementById('conn-status').style.color = "#00ff9d";
                document.getElementById('main-ui').style.opacity = "1";
                document.getElementById('main-ui').style.pointerEvents = "auto";
                document.getElementById('btn-status').disabled = false;

                log("連線成功。");
                readLoop();

                setTimeout(() => sendCommand({ cmd: "status" }), 500);
            } catch (e) { log("連線失敗: " + e); }
        };

        async function readLoop() {
            while (port && port.readable) {
                const decoder = new TextDecoder();
                reader = port.readable.getReader();
                try {
                    let buffer = "";
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        const text = decoder.decode(value, { stream: true });
                        buffer += text;
                        const lines = buffer.split('\n');
                        buffer = lines.pop();
                        for (let line of lines) {
                            const trimmed = line.trim();
                            if (trimmed.startsWith('{')) {
                                try {
                                    const json = JSON.parse(trimmed);
                                    if (pendingResolver && json.ack) {
                                        pendingResolver(json);
                                        pendingResolver = null;
                                    }
                                    if (json.ack === "status") {
                                        log(`✅ 狀態: 空間 ${Math.round(json.data.sys.fsFree / 1024)}K/${Math.round(json.data.sys.fsTotal / 1024)}K, 電量 ${json.data.bat.pct}%`);
                                    }
                                } catch (e) { }
                            } else if (trimmed.length > 0) {
                                log(trimmed, true);
                            }
                        }
                    }
                } catch (err) { log("讀取中斷: " + err); }
                finally { reader.releaseLock(); }
            }
        }

        async function sendCommand(json) {
            const encoder = new TextEncoder();
            const writer = port.writable.getWriter();
            await writer.write(encoder.encode(JSON.stringify(json) + '\n'));
            writer.releaseLock();
            return new Promise(resolve => {
                pendingResolver = resolve;
                setTimeout(() => { if (pendingResolver) { resolve({ ok: false, error: '超時' }); pendingResolver = null; } }, 10000);
            });
        }

        document.getElementById('btn-status').onclick = () => sendCommand({ cmd: "status" });

        document.getElementById('btn-upload').onclick = async () => {
            try {
                const name = document.getElementById('pet-name').value.trim() || "pet";
                const idleInput = document.getElementById('file-idle');
                if (idleInput.files.length === 0) return alert("請選取 Idle GIF");

                document.getElementById('progress-bar').style.display = 'block';
                document.getElementById('btn-upload').disabled = true;

                const filesToUpload = [];
                const manifest = {
                    name: name, mode: "gif",
                    colors: {
                        body: document.getElementById('color-body').value,
                        bg: document.getElementById('color-bg').value,
                        text: document.getElementById('color-text').value,
                        textDim: document.getElementById('color-textDim').value,
                        ink: document.getElementById('color-ink').value
                    },
                    states: {}
                };

                // Idle files
                if (idleInput.files.length > 1) {
                    manifest.states.idle = [];
                    for (let i = 0; i < idleInput.files.length; i++) {
                        const fn = `idle_${i}.gif`;
                        filesToUpload.push({ name: fn, file: idleInput.files[i] });
                        manifest.states.idle.push(fn);
                    }
                } else {
                    filesToUpload.push({ name: "idle.gif", file: idleInput.files[0] });
                    manifest.states.idle = "idle.gif";
                }

                // Other states
                const others = ['sleep', 'busy', 'attention', 'celebrate', 'dizzy', 'heart'];
                for (let s of others) {
                    const input = document.getElementById(`file-${s}`);
                    if (input.files && input.files.length > 0) {
                        const fn = `${s}.gif`;
                        filesToUpload.push({ name: fn, file: input.files[0] });
                        manifest.states[s] = fn;
                    } else {
                        manifest.states[s] = Array.isArray(manifest.states.idle) ? manifest.states.idle[0] : manifest.states.idle;
                    }
                }
                filesToUpload.push({ name: 'manifest.json', file: new Blob([JSON.stringify(manifest, null, 2)], { type: 'application/json' }) });

                let totalSize = 0;
                for (let f of filesToUpload) totalSize += f.file.size;

                log(`開始安裝: ${name}, 總體積: ${Math.round(totalSize / 1024)}KB`);
                const begin = await sendCommand({ cmd: "char_begin", name: name, total: totalSize });
                if (!begin || !begin.ok) throw new Error("初始化失敗: " + (begin ? begin.error : "空間不足"));

                let uploaded = 0;
                for (let f of filesToUpload) {
                    log(`傳送: ${f.name}`);
                    const fileRes = await sendCommand({ cmd: "file", path: f.name, size: f.file.size });
                    if (!fileRes.ok) throw new Error(`${f.name} 開啟失敗`);

                    const buffer = await f.file.arrayBuffer();
                    const bytes = new Uint8Array(buffer);
                    const chunkSize = 200;
                    for (let i = 0; i < bytes.length; i += chunkSize) {
                        const chunk = bytes.slice(i, i + chunkSize);
                        const b64 = btoa(String.fromCharCode.apply(null, chunk));
                        const chunkRes = await sendCommand({ cmd: "chunk", d: b64 });
                        if (!chunkRes.ok) throw new Error(`${f.name} 傳輸失敗`);
                        uploaded += chunk.length;
                        const pct = Math.round((uploaded / totalSize) * 100);
                        document.getElementById('progress-fill').style.width = pct + '%';
                        document.getElementById('progress-detail').textContent = `${Math.round(uploaded / 1024)}K / ${Math.round(totalSize / 1024)}K (${pct}%)`;
                    }
                    await sendCommand({ cmd: "file_end" });
                }

                log("正在同步...");
                const end = await sendCommand({ cmd: "char_end" });
                if (end && end.ok) log("✅ 安裝成功！寵物已變身。");
                else throw new Error("同步失敗");
            } catch (err) {
                log("❌ 錯誤: " + err.message);
                alert("上傳失敗: " + err.message);
            } finally {
                document.getElementById('btn-upload').disabled = false;
            }
        };
    </script>
</body>

</html>
